<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pixelopoly — Вход</title>
  <link rel="stylesheet" href="../css/extra-pages.css">
  <style>
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tabs button { flex: 1; padding: 10px; background: #80502f; color: white; border: none; cursor: pointer; font-weight: bold; }
    .tabs button.active { background: #607b3e; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #553; }
    .form-group input { width: 100%; padding: 10px; border: 2px solid #a87945; border-radius: 4px; }
    .error-msg { color: #d32f2f; font-weight: bold; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><a href="main.html">✦ PIXELOPOLY</a><a href="main.html">На главную</a></header>
  
  <section class="panel">
    <h1>ДОБРО ПОЖАЛОВАТЬ</h1>
    
    <div class="tabs">
      <button id="tab-login" class="active">Вход</button>
      <button id="tab-register">Регистрация</button>
    </div>

    <!-- Форма ВХОДА -->
    <form id="form-login">
      <div class="form-group">
        <label>Имя или Email</label>
        <input type="text" id="login-name" required placeholder="Введите логин">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-pass" required placeholder="••••••">
      </div>
      <button type="submit" class="action" style="width:100%;">ВОЙТИ</button>
    </form>

    <!-- Форма РЕГИСТРАЦИИ (скрыта по умолчанию) -->
    <form id="form-register" style="display:none;">
      <div class="form-group">
        <label>Имя игрока</label>
        <input type="text" id="reg-name" required minlength="2" placeholder="Например: DragonSlayer">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required placeholder="mail@example.com">
      </div>
      <div class="form-group">
        <label>Пароль (мин. 6 символов)</label>
        <input type="password" id="reg-pass" required minlength="6" placeholder="••••••">
      </div>
      <button type="submit" class="action" style="width:100%;">СОЗДАТЬ АККАУНТ</button>
    </form>

    <p id="message" class="error-msg"></p>
  </section>
</main>

<script>
  const msg = document.getElementById('message');
  const tabLogin = document.getElementById('tab-login');
  const tabReg = document.getElementById('tab-register');
  const formLogin = document.getElementById('form-login');
  const formReg = document.getElementById('form-register');

  // Переключение вкладок
  tabLogin.onclick = () => {
    tabLogin.classList.add('active'); tabReg.classList.remove('active');
    formLogin.style.display = 'block'; formReg.style.display = 'none';
    msg.textContent = '';
  };
  tabReg.onclick = () => {
    tabReg.classList.add('active'); tabLogin.classList.remove('active');
    formReg.style.display = 'block'; formLogin.style.display = 'none';
    msg.textContent = '';
  };

  // Функция для отправки запросов на сервер
  async function sendRequest(url, data) {
    try {
      const res = await fetch('/api' + url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Ошибка');
      return result;
    } catch (err) {
      msg.textContent = err.message;
      return null;
    }
  }

  // Отправка формы ВХОДА
  formLogin.onsubmit = async (e) => {
    e.preventDefault();
    const login = document.getElementById('login-name').value;
    const password = document.getElementById('login-pass').value;
    
    const data = await sendRequest('/auth/login', { login, password });
    if (data) window.location.href = 'main.html'; // Успешный вход
  };


  formReg.onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-pass').value;
    
    const data = await sendRequest('/auth/register', { username, email, password });
    if (data) window.location.href = 'main.html'; // Успешная регистрация
  };
</script>
</body>
</html>
